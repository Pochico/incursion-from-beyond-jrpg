<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diálogos">
<title>Editor de diálogos · Incursion From Beyond</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700;1,800&display=swap">
<style>
:root {
	--ink: #0b0b0d; --night: #16152a; --panel: #121220; --panel2: #1a1930;
	--line: rgba(242,242,244,.18); --line2: rgba(242,242,244,.35);
	--white: #f2f2f4; --gray: #8d8d96; --lime: #c6f432; --violet: #9b5cf0;
	--magenta: #c23cf0; --red: #ff3b47; --amber: #ffb347;
	--safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
	--nav-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--white);
	font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; }
body { display: flex; flex-direction: column; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--lime); }

/* --- Cabecera --- */
header { padding: calc(10px + var(--safe-t)) 14px 10px; display: flex; align-items: center; gap: 10px;
	border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #121222, var(--ink)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .bar { width: 8px; height: 30px; background: var(--lime); transform: skewX(-14deg); flex: none; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; font-style: italic; letter-spacing: -.2px; white-space: nowrap; }
.brand small { display: block; font-size: 10px; letter-spacing: 2.4px; color: var(--gray); font-style: normal; font-weight: 500; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbtn { border: 1px solid var(--line2); background: var(--night); border-radius: 10px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.hbtn.primary { border-color: var(--lime); color: var(--lime); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--lime); color: var(--ink); font-size: 11px; font-weight: 700; text-align: center; margin-left: 4px; }

/* --- Vistas --- */
main { flex: 1; min-height: 0; display: grid; }
.view { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--nav-h) + 24px + var(--safe-b)); display: none; }
.view.active { display: block; }
@media (min-width: 1100px) {
	main { grid-template-columns: 360px minmax(0, 1fr) 420px; }
	.view { display: block; padding-bottom: 30px; border-right: 1px solid var(--line); }
	#v-guardar { display: none; }
	nav { display: none !important; }
	.only-mobile { display: none !important; }
}
@media (max-width: 1099px) { .only-desktop { display: none !important; } }

/* --- Navegación inferior (móvil) --- */
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
	background: rgba(11,11,13,.96); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); backdrop-filter: blur(8px); z-index: 20; }
nav button { height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--gray); font-size: 12px; cursor: pointer; position: relative; }
nav button svg { width: 22px; height: 22px; }
nav button.active { color: var(--lime); }
nav button.active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--lime); transform: skewX(-20deg); }
nav .badge { position: absolute; top: 8px; right: calc(50% - 26px); }

/* --- Elementos comunes --- */
h2 { font-size: 17px; font-style: italic; font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 6px; height: 18px; background: var(--lime); transform: skewX(-14deg); }
h2:first-child { margin-top: 0; }
.muted { color: var(--gray); }
.small { font-size: 12.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.input, select.input, textarea.input { width: 100%; background: var(--ink); border: 1px solid var(--line2); border-radius: 10px; padding: 10px 11px; outline: none; }
.input:focus { border-color: var(--lime); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--gray) 50%), linear-gradient(135deg, var(--gray) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.btn { border: 1px solid var(--line2); background: var(--night); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.btn:active { transform: translateY(1px); }
.btn.lime { background: var(--lime); color: var(--ink); border-color: var(--lime); font-weight: 700; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.ghost { background: none; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line2); border-radius: 999px; padding: 6px 11px; font-size: 13px; cursor: pointer; background: var(--ink); user-select: none; }
.chip.on { background: var(--lime); color: var(--ink); border-color: var(--lime); font-weight: 600; }
.chip.small { padding: 3px 8px; font-size: 11.5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(242,242,244,.08); color: var(--white); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--amber); }
.empty { padding: 30px 10px; text-align: center; color: var(--gray); }

/* --- Lista de cues --- */
.cue-item { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--gray)); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.cue-item.sel { border-color: var(--lime); border-left-color: var(--c, var(--lime)); background: var(--panel2); }
.cue-item .name { font-weight: 600; font-size: 14px; word-break: break-all; }
.cue-item .meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
.warn { color: var(--amber); } .err { color: var(--red); } .ok { color: var(--lime); }

/* --- Editor --- */
.rule { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: rgba(155,92,240,.06); }
.crit { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 6px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line); }
.crit:first-of-type { border-top: 0; }
.crit .fields { display: flex; flex-wrap: wrap; gap: 6px; }
.crit .fields > * { flex: 1 1 120px; }
.crit .fields > .op { flex: 0 0 76px; }
.neg { border: 1px solid var(--line2); background: var(--ink); border-radius: 8px; padding: 9px 8px; font-size: 12px; cursor: pointer; color: var(--gray); }
.neg.on { background: var(--red); border-color: var(--red); color: var(--white); font-weight: 700; }
.x { border: 0; background: none; color: var(--gray); font-size: 20px; padding: 6px 8px; cursor: pointer; }
.sentence { font-style: italic; color: #d8d8e0; line-height: 1.45; }
.sentence b { color: var(--lime); font-weight: 600; font-style: normal; }
textarea.code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; min-height: 300px; tab-size: 4; white-space: pre; overflow-x: auto; resize: vertical; }
.toolbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.toolbar .btn { flex: none; }
.preview { font-size: 14px; line-height: 1.5; }
.preview .l { padding: 3px 0 3px calc(var(--ind) * 18px); }
.preview .sp { font-weight: 700; font-style: italic; }
.preview .narr { font-style: italic; color: #c9c9d3; }
.preview .opt { color: var(--lime); }
.preview .code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--gray); }
.preview .cmt { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #6d6d78; }
.issues div { padding: 4px 0; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--gray); }
.seg button.on { background: var(--lime); color: var(--ink); font-weight: 600; }

/* --- Simulador --- */
.result-main { border: 1px solid var(--lime); background: linear-gradient(120deg, rgba(198,244,50,.12), rgba(155,92,240,.08)); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.result-main .big { font-size: 18px; font-weight: 800; font-style: italic; word-break: break-all; }
.cand { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: start; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.cand .score { font-weight: 700; font-variant-numeric: tabular-nums; }
.cand.win .nm { color: var(--lime); font-weight: 700; }
.cand.fail { opacity: .72; }
.param { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
.param label { font-size: 13px; color: var(--gray); }
.slider { display: grid; grid-template-columns: minmax(0,1fr) 54px; gap: 8px; align-items: center; }
input[type=range] { width: 100%; accent-color: var(--lime); }
.num { width: 100%; text-align: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 4px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line2); background: var(--night); cursor: pointer; font-size: 18px; }
.stepper span { min-width: 22px; text-align: center; font-weight: 700; }

/* --- Hojas (diálogos modales) --- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.open { display: flex; }
.sheet { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 16px 16px calc(20px + var(--safe-b)); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0 0 12px; font-style: italic; font-weight: 800; }
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 13px; color: var(--gray); margin-bottom: 5px; }
.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-all; background: var(--ink); border-radius: 10px; padding: 8px; max-height: 320px; overflow: auto; }
.diff .a { color: var(--lime); } .diff .d { color: var(--red); } .diff .h { color: var(--violet); }


/* --- Flujo de la conversación --- */
.flow { display: flex; flex-direction: column; gap: 8px; }
.fcard { position: relative; max-width: 88%; border-radius: 14px; padding: 9px 12px 10px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; }
.fcard.npc { align-self: flex-start; border-left: 4px solid var(--c, var(--gray)); border-top-left-radius: 4px; }
.fcard.ren { align-self: flex-end; background: rgba(198,244,50,.1); border-color: rgba(198,244,50,.45); border-top-right-radius: 4px; }
.fcard.ren.opt { border-style: dashed; }
.fcard.narr { align-self: center; max-width: 94%; background: none; border: 1px dashed var(--line2); text-align: center; }
.fcard.narr .ftext { font-style: italic; color: #cfcfd8; }
.fcard:hover { border-color: var(--lime); }
.fhead { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; flex-wrap: wrap; }
.fcard.ren .fhead { justify-content: flex-end; }
.fcard.narr .fhead { justify-content: center; }
.fstep { font-size: 10.5px; color: var(--gray); font-variant-numeric: tabular-nums; border: 1px solid var(--line2); border-radius: 6px; padding: 0 5px; }
.fname { font-weight: 800; font-style: italic; font-size: 13.5px; color: var(--c, var(--white)); }
.fcard.ren .fname { color: var(--lime); }
.ftext { line-height: 1.42; white-space: pre-wrap; word-break: break-word; }
.ftag { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: rgba(155,92,240,.25); color: #e3d4ff; }
.fgroup { border: 1px solid rgba(155,92,240,.5); border-radius: 14px; padding: 9px; background: rgba(155,92,240,.07); }
.fgroup.variant { border-color: rgba(242,242,244,.25); background: rgba(242,242,244,.03); }
.fgroup.cond { border-color: rgba(255,179,71,.45); background: rgba(255,179,71,.05); }
.fglabel { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--violet); margin: 0 2px 6px; font-weight: 600; }
.fgroup.variant .fglabel { color: var(--gray); } .fgroup.cond .fglabel { color: var(--amber); }
.ftabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.ftab { flex: none; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line2); background: var(--ink); border-radius: 10px; padding: 7px 10px; font-size: 13px; cursor: pointer; text-align: left; }
.ftab.on { background: var(--violet); border-color: var(--violet); color: #fff; font-weight: 600; }
.fgroup.variant .ftab.on { background: var(--white); color: var(--ink); border-color: var(--white); }
.fgroup.cond .ftab.on { background: var(--amber); color: var(--ink); border-color: var(--amber); }
.ftab.add { color: var(--gray); border-style: dashed; }
.fbranch { display: flex; flex-direction: column; gap: 8px; border-left: 2px dashed rgba(155,92,240,.5); padding: 6px 0 2px 10px; margin-left: 4px; }
.fmut, .fend, .fcmt { align-self: center; font-size: 12.5px; border-radius: 8px; padding: 4px 10px; cursor: pointer; text-align: center; }
.fmut { background: rgba(39,180,245,.12); color: #9fdcff; border: 1px solid rgba(39,180,245,.35); }
.fmut.cond { background: rgba(255,179,71,.1); color: #ffd59a; border-color: rgba(255,179,71,.4); }
.fend { background: rgba(255,59,71,.08); color: #ff9aa0; border: 1px solid rgba(255,59,71,.35); }
.fend.goto { background: rgba(198,244,50,.08); color: var(--lime); border-color: rgba(198,244,50,.4); }
.fcmt { color: #70707c; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.fform { align-self: stretch; border: 1px solid var(--lime); border-radius: 14px; padding: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; cursor: default; }
.fform textarea { min-height: 70px; resize: vertical; }
.fform .row .btn { flex: none; }
.fadd { display: flex; justify-content: center; margin-top: 4px; }

#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + var(--safe-b)); transform: translateX(-50%); background: var(--night); border: 1px solid var(--lime); color: var(--white); padding: 10px 16px; border-radius: 12px; z-index: 60; display: none; max-width: 92vw; font-size: 14px; }
#toast.err { border-color: var(--red); }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: var(--ink); z-index: 50; }
#loading .spin { width: 34px; height: 34px; border: 3px solid var(--line2); border-top-color: var(--lime); border-radius: 50%; animation: s 0.8s linear infinite; }
@keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
	<div class="brand">
		<div class="bar"></div>
		<div style="min-width:0">
			<h1>Editor de diálogos</h1>
			<small id="src-label">Incursion From Beyond</small>
		</div>
	</div>
	<button class="hbtn primary only-desktop" id="btn-save-desk">Guardar <span id="badge-desk"></span></button>
	<button class="hbtn" id="btn-settings" aria-label="Ajustes">⋯</button>
</header>

<main>
	<section class="view active" id="v-lista"></section>
	<section class="view" id="v-editar"></section>
	<section class="view" id="v-simular"></section>
	<section class="view" id="v-guardar"></section>
</main>

<nav>
	<button data-v="lista" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Diálogos</button>
	<button data-v="editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>Editar</button>
	<button data-v="simular"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16l13-8z"/></svg>Simular</button>
	<button data-v="guardar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z M8 4v5h8V4 M8 20v-6h8v6"/></svg>Guardar<span id="badge-nav"></span></button>
</nav>

<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div><div class="muted" id="loading-text">Cargando diálogos…</div></div>

<script src="motor.js"></script>
<script src="flujo.js"></script>
<script src="app.js"></script>
</body>
</html>
